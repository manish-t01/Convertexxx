server:
  port: 8080

spring:
  application:
    name: convertexxx-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/convertexxx
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

convertexxx:
  cors:
    allowed-origins: http://localhost:3000

app:
  upload:
    directory: uploads/
    max-file-size: 50MB
