spring.application.name=convertexxx
server.port=${SERVER_PORT:8080}

convertexxx.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
convertexxx.storage.upload.directory=${CONVERTEXXX_UPLOAD_DIRECTORY:./storage/uploads}
convertexxx.storage.temporary.directory=${CONVERTEXXX_TEMPORARY_DIRECTORY:./storage/temp}
convertexxx.storage.temporary.cleanup-cron=${CONVERTEXXX_TEMPORARY_CLEANUP_CRON:0 0 * * * *}

spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.root=INFO
logging.level.com.convertexxx=INFO
logging.level.org.springframework.web=WARN
